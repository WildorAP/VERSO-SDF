[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "cd backend && python manage.py migrate --noinput"
startCommand = "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
# Desactivado hasta tener un deploy Active estable (evita Failed con gunicorn OK).
# healthcheckPath = "/.well-known/stellar.toml"
# healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
